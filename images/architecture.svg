</text>
<text x="1075.0" y="1226" class="body" text-anchor="middle">
<tspan x="1075.0" dy="0">包住 Discord token</tspan>
<tspan x="1075.0" dy="22">envelope encryption</tspan>
</text>
<rect x="1280" y="1160" width="300" height="110" rx="18" fill="#fff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
<text x="1430.0" y="1194" class="boxTitle" text-anchor="middle">
<tspan x="1430.0" dy="0">Secret Manager</tspan>
</text>
<text x="1430.0" y="1226" class="body" text-anchor="middle">
<tspan x="1430.0" dy="0">Discord client secret</tspan>
<tspan x="1430.0" dy="22">Bot token / HMAC key</tspan>
</text>
<rect x="1635" y="1160" width="300" height="110" rx="18" fill="#fff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
<text x="1785.0" y="1194" class="boxTitle" text-anchor="middle">
<tspan x="1785.0" dy="0">Cloud Logging</tspan>
</text>
<text x="1785.0" y="1226" class="body" text-anchor="middle">
<tspan x="1785.0" dy="0">operational logs</tspan>
<tspan x="1785.0" dy="22">不記 raw content / token</tspan>
</text>
