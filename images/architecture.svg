</text>
<text x="690.0" y="1226" class="body" text-anchor="middle">
<tspan x="690.0" dy="0">identities / mcp_sessions</tspan>
<tspan x="690.0" dy="22">oauth_* / nonces / audit_logs / allowlist</tspan>
</text>
<rect x="925" y="1160" width="300" height="110" rx="18" fill="#fff" stroke="#64748b" stroke-width="2" filter="url(#shadow)"/>
