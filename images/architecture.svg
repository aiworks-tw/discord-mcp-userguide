<text x="1785" y="1032" class="arrowLabel" text-anchor="middle">logs</text>
<line x1="655" y1="525" x2="655" y2="585" stroke="#1f2937" stroke-width="2.8" marker-end="url(#arrow)"/>
<line x1="655" y1="705" x2="655" y2="765" stroke="#1f2937" stroke-width="2.8" marker-end="url(#arrow)"/>
<line x1="990" y1="345" x2="990" y2="405" stroke="#1f2937" stroke-width="2.8" marker-end="url(#arrow)"/>
<line x1="655" y1="345" x2="655" y2="405" stroke="#1f2937" stroke-width="2.8" marker-end="url(#arrow)"/>
<rect x="1540" y="770" width="600" height="245" rx="24" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" filter="url(#shadow)"/>
<text x="1585" y="825" class="section" text-anchor="start">核心安全邊界</text>
<text x="1840" y="870" class="body" text-anchor="middle">
<tspan x="1840" dy="0">1. tenant 只從 MCP session 解析</tspan>
<tspan x="1840" dy="30">2. guild 必須 allowlisted</tspan>
<tspan x="1840" dy="30">3. user 與 bot 都要有 Discord 權限</tspan>
<tspan x="1840" dy="30">4. 寫入必須 confirmation token + nonce</tspan>
<tspan x="1840" dy="30">5. audit 只存 HMAC，不存 raw message</tspan>
</text>
<rect x="60" y="1370" width="2080" height="55" rx="18" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<text x="1100" y="1405" class="body" text-anchor="middle">
<tspan x="1100" dy="0">架構重點：REST-only Discord bot；Cloud Run stateless；Firestore 保存 session / nonce / audit / allowlist；KMS 與 Secret Manager 處理敏感資料。</tspan>
</text>
