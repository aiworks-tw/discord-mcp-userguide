<text x="655.0" y="959" class="boxTitle" text-anchor="middle">
<tspan x="655.0" dy="0">Audit Logger</tspan>
</text>
<text x="655.0" y="991" class="body" text-anchor="middle">
<tspan x="655.0" dy="0">success / failure + HMAC</tspan>
</text>
<rect x="850" y="925" width="280" height="70" rx="18" fill="#fff" stroke="#f97316" stroke-width="2" filter="url(#shadow)"/>
<text x="990.0" y="959" class="boxTitle" text-anchor="middle">
<tspan x="990.0" dy="0">Crypto</tspan>
</text>
<text x="990.0" y="991" class="body" text-anchor="middle">
<tspan x="990.0" dy="0">HMAC + KMS envelope</tspan>
</text>
